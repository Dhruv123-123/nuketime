<text x="30" y="150" font-weight="bold" fill="#0b0b0b" font-size="11.5">Gas reservoir (top 3 m)</text>
<text x="30" y="164" fill="#52514e" font-size="11">Nitrogen charge blankets the</text>
<text x="30" y="178" fill="#52514e" font-size="11">condenser below 45 °C vapour,</text>
<text x="30" y="192" fill="#52514e" font-size="11">so the leak to rock in normal</text>
<text x="30" y="206" fill="#52514e" font-size="11">operation is about zero. Fully</text>
<text x="30" y="220" fill="#52514e" font-size="11">open by 95 °C.</text>
<text x="30" y="245" font-weight="bold" fill="#0b0b0b" font-size="11.5">Condenser legs (57 m each)</text>
<text x="30" y="259" fill="#52514e" font-size="11">125 mm ID stainless tube grouted</text>
<text x="30" y="273" fill="#52514e" font-size="11">in a 165 mm uphole. Tilted 0, 10,</text>
<text x="30" y="287" fill="#52514e" font-size="11">20 and 30° outward, alternating</text>
<text x="30" y="301" fill="#52514e" font-size="11">around the ring, so the rock</text>
<text x="30" y="315" fill="#52514e" font-size="11">loaded per hole grows with height.</text>
<text x="30" y="345" font-weight="bold" fill="#0b0b0b" font-size="11.5">Insulated riser (8 m)</text>
<text x="30" y="359" fill="#52514e" font-size="11">keeps the crowded collar zone</text>
<text x="30" y="373" fill="#52514e" font-size="11">from overheating.</text>
<text x="30" y="400" font-weight="bold" fill="#0b0b0b" font-size="11.5">Ring drift, r = 15 m</text>
<text x="30" y="414" fill="#52514e" font-size="11">3 × 3 m tunnel holding the steam</text>
<text x="30" y="428" fill="#52514e" font-size="11">torus. The 4 m evaporator of each</text>
<text x="30" y="442" fill="#52514e" font-size="11">thermosyphon sits in the torus;</text>
<text x="30" y="456" fill="#52514e" font-size="11">jacket steam condenses on it and</text>
<text x="30" y="470" fill="#52514e" font-size="11">drains back down a sloped line.</text>
<text x="742" y="150" font-weight="bold" fill="#0b0b0b" font-size="11.5">Rock does the rest</text>
<text x="742" y="164" fill="#52514e" font-size="11">Hottest borehole wall 70 °C at</text>
<text x="742" y="178" fill="#52514e" font-size="11">3.7 h after scram, then about</text>
<text x="742" y="192" fill="#52514e" font-size="11">50 to 56 °C from week 1 to year 3.</text>
<text x="742" y="245" font-weight="bold" fill="#0b0b0b" font-size="11.5">Containment jacket</text>
<text x="742" y="259" fill="#52514e" font-size="11">0.3 m water annulus and steam</text>
<text x="742" y="273" fill="#52514e" font-size="11">drum around the steel containment.</text>
<text x="742" y="287" fill="#52514e" font-size="11">120 t water, closed, rated 0.5 MPa.</text>
<text x="742" y="301" fill="#52514e" font-size="11">Held at 25 °C by a small chiller in</text>
<text x="742" y="315" fill="#52514e" font-size="11">normal operation. After a scram with</text>
<text x="742" y="329" fill="#52514e" font-size="11">nothing working it peaks at 95 °C</text>
<text x="742" y="343" fill="#52514e" font-size="11">and 0.08 MPa gauge.</text>
<text x="742" y="370" font-weight="bold" fill="#0b0b0b" font-size="11.5">Result</text>
<text x="742" y="384" fill="#52514e" font-size="11">Unlimited grace period with no</text>
<text x="742" y="398" fill="#52514e" font-size="11">operator action, no water and no</text>
<text x="742" y="412" fill="#52514e" font-size="11">power, in granite, limestone and</text>
<text x="742" y="426" fill="#52514e" font-size="11">shale.</text>
<text x="20" y="700" fill="#52514e" font-size="11">Heat path: core, reactor vessel, steam in containment, containment wall, boiling jacket, torus, thermosyphon evaporators, vapour up the upholes,</text>
<text x="20" y="715" fill="#52514e" font-size="11">condensate film, tube wall, grout, bedrock, and over months the ground surface. Every step is driven by gravity, pressure difference or conduction.</text>
</svg>