<text x="20" y="28" font-size="16" font-weight="bold" fill="#0b0b0b">ROCKSINK: bedrock as the passive ultimate heat sink (vertical section, 5.5 px per metre)</text>
<text x="20" y="46" fill="#52514e">One 250 MWth integral PWR module. 128 sealed water thermosyphons fan from a ring drift into 7.3 km of grouted uphole.</text>
<text x="20" y="61" fill="#52514e">No pool, no tower, no valves, no pumps, no power, and nothing above grade to hit.</text>
